name: build-site
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7
      - run: python3 engine/build.py
      - name: Commit built site
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add -A site/
          git diff --cached --quiet || git commit -m "build: regenerate site"
          git pull --rebase origin main
          git push
